version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projectflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    command: daphne config.asgi:application -b 0.0.0.0 -p 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEBUG=True
      - SECRET_KEY=dev-secret-key
      - DB_NAME=projectflow
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CHANNELS_REDIS_URL=redis://redis:6379/3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend


    # NEW: Payment Gateway Service
  payment-gateway:
    build: 
      context: ./payment-gateway
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./payment-gateway:/app
    ports:
      - "8001:8001"
    environment:
      - STRIPE_SECRET_KEY=sk_test_YOUR_STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET=whsec_YOUR_WEBHOOK_SECRET
      - INTERNAL_API_KEY=super-secret-gateway-key-123

volumes:
  postgres_data: